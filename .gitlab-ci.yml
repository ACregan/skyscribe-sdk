default:
  image: node:22
  tags:
    - SERVER-docker-runner

stages:
  - typecheck
  - test
  - publish
  - deploy
  - maintenance

# Docs jobs (apps/docs, sdk.skyscribe.app; ADR 0003) only run when the docs
# or this file changed, so package-only MRs don't pay for a docs build.
.docs-changes: &docs-changes
  - apps/docs/**/*
  - package-lock.json
  - .gitlab-ci.yml

typecheck:
  stage: typecheck
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm ci
    - npm run typecheck

test:
  stage: test
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm ci
    - npm run test

publish:
  stage: publish
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  # Stages unpublished versions; a maintainer approves them with 2FA
  # (ADR 0003). `npm stage` needs npm 11.15+, newer than node:22 bundles.
  # Upgrade only after building: npm 11 lays out node_modules differently
  # and skips install scripts by default, so install and build stay on the
  # same bundled npm as the typecheck/test jobs.
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm ci
    - npm run build
    - npm install -g npm@^11.15.0
    - bash scripts/stage-publish.sh

# Typecheck, unit tests, a full build (prerender, search index, CSP) and a
# check of every internal link and #anchor in the output. Blocking.
docs:check:
  stage: test
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docs-changes
  script:
    - npm ci
    - npm run typecheck --workspace=apps/docs
    - npm run test --workspace=apps/docs
    - npm run docs:build
    - npm run check-links --workspace=apps/docs
  artifacts:
    paths:
      - apps/docs/build/client/
    expire_in: 1 hour

# External links depend on other people's sites, so this only warns.
# Reuses docs:check's build; the script needs nothing beyond Node.
docs:links-external:
  stage: test
  interruptible: true
  needs: ["docs:check"]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docs-changes
  script:
    - node apps/docs/scripts/check-links.ts --external

# Manual, main only, like every other deploy. Needs CLOUDFLARE_API_TOKEN
# (Workers deploy permission on the skyscribe.app account) and
# CLOUDFLARE_ACCOUNT_ID as CI/CD variables. Deploying separately from
# `publish` means docs for a new API can wait until it's on npm.
docs:deploy:
  stage: deploy
  interruptible: false
  environment:
    name: docs
    url: https://sdk.skyscribe.app
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *docs-changes
      when: manual
  script:
    - npm ci
    - npm run docs:build
    - npm run deploy --workspace=apps/docs

# Renovate (renovate.json): one grouped minor/patch MR on Mondays, majors
# only once approved on the Dependency Dashboard issue, security fixes any
# day. Mostly dev tooling and the docs app, so its MRs need no changeset:
# the published packages' ranges are left alone and only the lockfile
# moves. A docs app update reaches sdk.skyscribe.app on the next
# `docs:deploy`.
#
# Setup (GitLab schedules aren't declared in YAML): a daily schedule on
# main with SCHEDULED_JOB=renovate, and masked CI variables
# GITLAB_PUSH_TOKEN (a project access token, Developer role, scopes api
# and write_repository) and GITHUB_COM_TOKEN (read-only, for changelogs).
# Schedules skip publish and docs:deploy, which would otherwise wait as
# manual jobs on every run.
renovate:
  stage: maintenance
  # Renovate 44 needs Node 24 (it calls RegExp.escape); the other jobs stay
  # on 22, the lowest Node the packages support.
  image: node:24
  needs: []
  script:
    - npx --yes renovate@44 --platform=gitlab --endpoint="https://${CI_SERVER_HOST}/api/v4" --token="$GITLAB_PUSH_TOKEN" "$CI_PROJECT_PATH"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB == "renovate"
